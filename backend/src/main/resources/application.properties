# ========================================================
# SMART LIBRARY MANAGEMENT SYSTEM - BACKEND CONFIGURATION
# College Mini Project (Experiment 10) - Spring Boot & MySQL
# ========================================================

# Server HTTP Port
server.port=8080

# Spring Application Name
spring.application.name=library-management-system

# ========================================================
# MySQL Database Configuration
# ========================================================
# Note for NetBeans/Local Setup:
# Make sure your MySQL server is running (Port 3306)
# Command to create database: CREATE DATABASE library_db;
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================================================
# Hibernate / JPA Configuration
# ========================================================
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 'update' automatically updates database schema without dropping existing tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ========================================================
# JWT Security Configuration
# ========================================================
# 256-bit secure secret key for signing tokens
app.jwt.secret=9a4f2c8d3e7b1a5f6e8d2c4b7a9e1f3a5b7c9d1e3f5a7b9c1d3e5f7a9b1c3d5e
# Token expiration time: 24 Hours in milliseconds (86400000)
app.jwt.expiration-ms=86400000

# ========================================================
# File Upload / Multipart Configuration (Book Covers)
# ========================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
